[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-dynamic-translations"
version = "0.1.0"
description = "Model-specific Django translations with natural field aliases, forms, and admin integration."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Andrea Bellomia" }]
keywords = ["django", "i18n", "localization", "translations"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = ["Django>=5.2,<6.2"]

[project.urls]
Homepage = "https://github.com/AndreaBellomia/django-dynamic-translations"
Repository = "https://github.com/AndreaBellomia/django-dynamic-translations"
Issues = "https://github.com/AndreaBellomia/django-dynamic-translations/issues"

[dependency-groups]
dev = [
    "pyright>=1.1.403",
    "pytest>=8.4",
    "pytest-django>=4.11",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/django_dynamic_translations"]

[tool.hatch.build.targets.sdist]
include = [
    "/CHANGELOG.md",
    "/README.md",
    "/pyproject.toml",
    "/src",
    "/tests",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.pyright]
include = ["src/django_dynamic_translations"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
